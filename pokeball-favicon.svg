<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pokeball {
        animation: spin 2s linear infinite;
        transform-origin: 16px 16px;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Top half (red) -->
  <path d="M 16 1 A 15 15 0 0 1 31 16 L 1 16 A 15 15 0 0 1 16 1 Z" fill="#dc3545" class="pokeball"/>
  
  <!-- Bottom half (white) -->
  <path d="M 16 31 A 15 15 0 0 1 1 16 L 31 16 A 15 15 0 0 1 16 31 Z" fill="#ffffff" class="pokeball"/>
  
  <!-- Middle line -->
  <line x1="1" y1="16" x2="31" y2="16" stroke="#343a40" stroke-width="2" class="pokeball"/>
  
  <!-- Center circle (outer) -->
  <circle cx="16" cy="16" r="6" fill="#ffffff" stroke="#343a40" stroke-width="2" class="pokeball"/>
  
  <!-- Center circle (inner) -->
  <circle cx="16" cy="16" r="3" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" class="pokeball"/>
</svg>
